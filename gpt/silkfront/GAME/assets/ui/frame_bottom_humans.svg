<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
<defs>
  <!-- Silver Metal (Multi-stop reflective metallic gradient) -->
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f5f7fa"/>
    <stop offset="22%" stop-color="#d6dce4"/>
    <stop offset="48%" stop-color="#8b95a3"/>
    <stop offset="54%" stop-color="#525a66"/>
    <stop offset="78%" stop-color="#b8c2cf"/>
    <stop offset="100%" stop-color="#3c424c"/>
  </linearGradient>
  <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="25%" stop-color="#dfe5ed"/>
    <stop offset="55%" stop-color="#8d97a5"/>
    <stop offset="80%" stop-color="#49505c"/>
    <stop offset="100%" stop-color="#aab4c2"/>
  </linearGradient>
  <!-- Cold Steel -->
  <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#9aa4b2"/>
    <stop offset="50%" stop-color="#565f6b"/>
    <stop offset="100%" stop-color="#252930"/>
  </linearGradient>
  <linearGradient id="ironGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#7c8591"/>
    <stop offset="45%" stop-color="#474e58"/>
    <stop offset="100%" stop-color="#1d2026"/>
  </linearGradient>
  <!-- Light Gothic Stone & Dark Graphite -->
  <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#484b52"/>
    <stop offset="50%" stop-color="#2c2f35"/>
    <stop offset="100%" stop-color="#16181c"/>
  </linearGradient>
  <linearGradient id="stoneLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#5a5e66"/>
    <stop offset="50%" stop-color="#383b42"/>
    <stop offset="100%" stop-color="#1d1f24"/>
  </linearGradient>
  <!-- Deep Burgundy & Ivory -->
  <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#b82c3b"/>
    <stop offset="45%" stop-color="#7c1823"/>
    <stop offset="85%" stop-color="#4a0c14"/>
    <stop offset="100%" stop-color="#240509"/>
  </linearGradient>
  <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fbf7ee"/>
    <stop offset="45%" stop-color="#e3dac8"/>
    <stop offset="85%" stop-color="#9e9583"/>
    <stop offset="100%" stop-color="#4d473d"/>
  </linearGradient>
  <!-- Nerubian Obsidian, Chitin & Bioluminescent Turquoise -->
  <linearGradient id="chitinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#462b5e"/>
    <stop offset="48%" stop-color="#261638"/>
    <stop offset="100%" stop-color="#0d0714"/>
  </linearGradient>
  <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#d6fff9"/>
    <stop offset="38%" stop-color="#47c3b4"/>
    <stop offset="78%" stop-color="#166b64"/>
    <stop offset="100%" stop-color="#072826"/>
  </linearGradient>
  <linearGradient id="essenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e4d4ff"/>
    <stop offset="30%" stop-color="#b582ff"/>
    <stop offset="70%" stop-color="#793eed"/>
    <stop offset="100%" stop-color="#3b1180"/>
  </linearGradient>
  <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ba864e"/>
    <stop offset="50%" stop-color="#7d5229"/>
    <stop offset="100%" stop-color="#442a12"/>
  </linearGradient>
  <linearGradient id="silkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="40%" stop-color="#d6dce4"/>
    <stop offset="75%" stop-color="#8e97a3"/>
    <stop offset="100%" stop-color="#4e555f"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
    <stop offset="58%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.88)"/>
  </radialGradient>
  <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

  <!-- Base Carved Stone Slab -->
  <rect x="0" y="0" width="800" height="180" fill="url(#stoneLightGrad)"/>
  <!-- Subtle Stone Ashlar Blocks & Cracks -->
  <g stroke="#1b1d22" stroke-width="1.2" opacity="0.55">
    <line x1="0" y1="45" x2="800" y2="45"/><line x1="0" y1="95" x2="800" y2="95"/><line x1="0" y1="145" x2="800" y2="145"/>
    <line x1="110" y1="0" x2="110" y2="180"/><line x1="235" y1="45" x2="235" y2="180"/><line x1="460" y1="0" x2="460" y2="180"/><line x1="680" y1="45" x2="680" y2="180"/>
  </g>
  <!-- Gothic Pointed Arch Reliefs in Stone -->
  <path d="M30 180 L30 38 C30 14 86 14 86 38 L86 180 M150 180 L150 38 C150 14 206 14 206 38 L206 180 M594 180 L594 38 C594 14 650 14 650 38 L650 180 M714 180 L714 38 C714 14 770 14 770 38 L770 180" fill="none" stroke="#8d97a5" stroke-width="1.5" opacity="0.28"/>
  <!-- Deep Burgundy Heraldic Side Pennants -->
  <polygon points="14,10 54,10 54,68 34,54 14,68" fill="url(#crimsonGrad)" stroke="url(#silverGrad)" stroke-width="1.2" opacity="0.85"/>
  <polygon points="746,10 786,10 786,68 766,54 746,68" fill="url(#crimsonGrad)" stroke="url(#silverGrad)" stroke-width="1.2" opacity="0.85"/>
  <!-- Multi-layered Cold-Steel & Silver Top Cornice -->
  <rect x="0" y="0" width="800" height="9" fill="url(#ironGrad)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#silverGrad)"/>
  <rect x="0" y="9" width="800" height="2" fill="#0d0e11"/>
  <!-- Heavy Forged Silver Corner Gussets -->
  <path d="M0 0 L56 0 L42 14 L14 14 L14 42 L0 56 Z" fill="url(#silverGrad)" stroke="#1d2026" stroke-width="1.2"/>
  <path d="M800 0 L744 0 L758 14 L786 14 L786 42 L800 56 Z" fill="url(#silverGrad)" stroke="#1d2026" stroke-width="1.2"/>
  <!-- Steel Rivet Studs -->
  <g fill="#f0f4f8" stroke="#252930" stroke-width="0.9">
    <circle cx="80" cy="5" r="2.4"/><circle cx="180" cy="5" r="2.4"/><circle cx="280" cy="5" r="2.4"/><circle cx="380" cy="5" r="2.4"/>
    <circle cx="420" cy="5" r="2.4"/><circle cx="520" cy="5" r="2.4"/><circle cx="620" cy="5" r="2.4"/><circle cx="720" cy="5" r="2.4"/>
  </g>
</svg>