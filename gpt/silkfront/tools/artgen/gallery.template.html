<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>SILKFRONT — Unit Gallery (review gate 01)</title>
<style>
:root{--bg:#101118;--panel:#1a1c25;--line:#2c2f3b;--txt:#d6dce4;--dim:#8a94a8;--gold:#b08d4a;--teal:#47c3b4;--bord:#8a2c38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:.12em}h1 b{color:var(--gold)}.note{color:var(--dim);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px;border-bottom:1px solid var(--line)}
nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:6px 10px;border-radius:4px;cursor:pointer}
nav button.h{border-left:3px solid var(--bord)}nav button.s{border-left:3px solid var(--teal)}nav button.on{background:#2a2d3a;outline:1px solid var(--gold)}
main{padding:20px 24px;display:grid;gap:20px}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.card h2{margin:0 0 4px;font-size:17px}.card h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.st{text-align:center}.st canvas{display:block;border:1px solid var(--line);border-radius:4px}
.st span{display:block;font-size:12px;color:var(--dim);margin-top:4px}
.ground{background:radial-gradient(ellipse at 50% 80%,#3a4150 0,#262a35 45%,#1a1c25 80%)}
.ground.light{background:#7f8a72}.ground.chk{background:repeating-conic-gradient(#2a2d36 0 25%,#20222a 0 50%) 0 0/16px 16px}
.sheet{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:4px}
.sheet img{display:block;image-rendering:auto}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px;color:var(--dim);font-size:12px}
.tools select,.tools input{background:#11131a;color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:3px}
a{color:var(--teal)}table{border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 8px;text-align:left}
#field canvas{width:100%;border-radius:4px;border:1px solid var(--line)}
</style></head><body>
<header><h1>SILK<b>FRONT</b> · юниты</h1>
<span class="note">Контрольный этап 01 · 10 боевых юнитов · процедурные SVG → PNG · один ракурс, взгляд вправо (+X)</span></header>
<nav id="nav"></nav>
<main id="main"></main>

const DATA = /*DATA*/null;

<script src="gallery_view.js"></script>
</body></html>
