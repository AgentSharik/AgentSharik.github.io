<!doctype html><html lang="ru"><meta charset="utf-8"><title>SILKFRONT — окружение и 10 юнитов</title><style>body{background:#151920;color:#ddd;font:14px system-ui;margin:16px}h1{font-size:22px}canvas{display:block;max-width:100%;height:auto;margin-bottom:12px}small{color:#aaa}</style><h1>Окружение и десять юнитов — проверочный монтаж</h1><p>Все юниты ×0.5 без изменений. Ель ×0.5; валун ×0.4; бочка ×0.22; трава ×0.25. Это проверка масштаба, не подключение к игре и не художественное принятие.</p><canvas id="compare" width="850" height="440"></canvas><p>Тайлы 3×3, размер повтора 64px. Проверять швы и повторяемость отдельно от объектов.</p><canvas id="tiles" width="850" height="240"></canvas><p id="status">Загрузка…</p><script type="module">
import {UNITS} from '../GAME/src/data.js';
const ids=Object.entries(UNITS).filter(([,d])=>d.art);
const image=async src=>{const im=new Image();im.src=src;await im.decode();return im;};
const env=Object.fromEntries(await Promise.all(['veg_pine','rock_boulder','env_barrel','veg_dry_grass','tile_forest','tile_dirt','tile_ash','tile_grass'].map(async id=>[id,await image('review/'+id+'.png')])));
const g=document.getElementById('compare').getContext('2d');
for(const [i,[id,d]] of ids.entries()){
 const x=(i%5)*170,y=Math.floor(i/5)*220,base=y+190;
 g.fillStyle='#303a30';g.fillRect(x,y,168,218);g.drawImage(env.tile_forest,x,y+35,168,180);
 const e=['veg_pine','rock_boulder','env_barrel','veg_dry_grass','veg_pine'][i%5],s={veg_pine:.5,rock_boulder:.4,env_barrel:.22,veg_dry_grass:.25}[e];
 g.drawImage(env[e],x+48-128*s,base-228*s,256*s,256*s);
 const json=await fetch(`../ART/${d.fac}/UNITS/${id}/${id}_sheet.json`).then(r=>r.json());
 const im=await image(`../ART/${d.fac}/UNITS/${id}/${id}_sheet.png`),f=json.frames.idle_00.frame,p=json.meta.pivotPx;
 g.drawImage(im,f.x,f.y,f.w,f.h,x+118-p[0]*.5,base-p[1]*.5,f.w*.5,f.h*.5);
 g.fillStyle='#eee';g.font='12px system-ui';g.fillText(d.ru,x+7,y+15,155);g.font='11px system-ui';g.fillText(e,x+7,y+30);g.strokeStyle='#b5bca1';g.beginPath();g.moveTo(x+5,base);g.lineTo(x+163,base);g.stroke();
}
const t=document.getElementById('tiles').getContext('2d');
['tile_dirt','tile_forest','tile_ash','tile_grass'].forEach((id,i)=>{for(let y=0;y<3;y++)for(let x=0;x<3;x++)t.drawImage(env[id],i*210+x*64,20+y*64,64,64);t.fillStyle='#ddd';t.fillText(id,i*210,12);});
document.getElementById('status').textContent='Загружены 10 юнитов и контрольное окружение. Все изображения декодированы.';
</script></html>
