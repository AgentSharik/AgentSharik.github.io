
<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            background: #111318;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        h1 {
            font-size: 36px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 35px;
        }

        .card {
            display: block;
            padding: 25px;
            background: #20242d;
            border: 1px solid #353b48;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .card:hover {
            background: #303744;
            transform: translateY(-3px);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #aeb5c2;
        }
    </style>
</head>
